[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "Knowledge base server: FastAPI + PostgreSQL/pgvector + Elasticsearch + LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "elasticsearch[async]>=8.14,<9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "mcp>=1.0",
    "openai>=1.40",
    "pgvector>=0.3",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.4",
    "python-frontmatter>=1.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Agent-harness scripts (.claude/.codex/.agents/...) are tooling, not project code.
extend-exclude = [".claude", ".codex", ".agents", ".cursor", ".trellis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live_llm'"
markers = [
    "live_llm: tests that call a real LLM provider (excluded from the default run)",
]
