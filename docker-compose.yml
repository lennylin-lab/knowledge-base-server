services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 12

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      args:
        ES_VERSION: "8.17.3"
    image: kb-elasticsearch:8.17.3-ik
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Task-queue mode for indexing (opt-in): set KB_REDIS_URL=redis://localhost:6379
  # and run `python -m app.cli worker`. Nothing depends on this service — with
  # the default empty KB_REDIS_URL the app indexes via in-process background
  # tasks. Restart/supervision policy is the deployment's job; add
  # `restart: unless-stopped` here if you want compose to supervise the worker.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # stdio→HTTP MCP sidecar (opt-in): docker compose --profile mcp up -d --build
  # mcp-context7. Serves http://127.0.0.1:9300/mcp for the host-run API; the
  # app-side mcp.json entry is the "url" form. See docs/mcp-sidecars.md.
  mcp-context7:
    profiles: ["mcp"]
    build:
      context: ./docker/mcp-sidecar
      args:
        SUPERGATEWAY_VERSION: "3.4.3"
        MCP_PACKAGE: "@upstash/context7-mcp"
        MCP_VERSION: "4.1.1"
    image: kb-mcp-context7:supergateway-3.4.3
    ports:
      - "127.0.0.1:9300:9300"

volumes:
  pgdata:
  esdata:
