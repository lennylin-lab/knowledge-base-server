services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 12

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      args:
        ES_VERSION: "8.17.3"
    image: kb-elasticsearch:8.17.3-ik
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Task-queue mode for indexing (opt-in): set KB_REDIS_URL=redis://localhost:6379
  # and run `python -m app.cli worker`. Nothing depends on this service — with
  # the default empty KB_REDIS_URL the app indexes via in-process background
  # tasks. Restart/supervision policy is the deployment's job; add
  # `restart: unless-stopped` here if you want compose to supervise the worker.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local OIDC IdP for user login (dev only). Imports realm `kb` from
  # docker/keycloak/import/kb-realm.json (copy from kb-realm.json.example;
  # gitignored). Dev user credentials live in .env — see bootstrap-dev-user.sh.
  # Admin console: http://localhost:8180. Host port 8180 avoids clashing with
  # other local services on 8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

volumes:
  pgdata:
  esdata:
  keycloakdata:
