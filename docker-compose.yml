# Local / standalone container orchestration for knowledge-base-server.
#
# Storage services (PostgreSQL + pgvector, Elasticsearch + analysis-ik, Redis)
# are NOT orchestrated here — provision them externally (e.g. via
# `knowledge-base-database` or `knowledge-base-deploy`) and configure
# KB_DATABASE_URL, KB_ELASTICSEARCH_URL, and optional KB_REDIS_URL in `.env`.
#
# For containers reaching storage exposed on the Docker host (including Linux),
# use `host.docker.internal` in `.env` (mapped via `extra_hosts` below) or
# point directly to external hosts / networks.
#
# Usage:
#   docker compose up -d --build                        # API container
#   docker compose --profile queue up -d --build        # + ARQ worker (needs KB_REDIS_URL)
#   docker compose --profile mcp up -d --build mcp-context7  # MCP sidecar only (host-run API)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Bind-mounted below. An empty (or absent, auto-created) ./mcp-config
      # dir means "no mcp.json" — MCP stays disabled, startup stays clean.
      KB_MCP_CONFIG_PATH: ${KB_MCP_CONFIG_PATH:-/mcp-config/mcp.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mcp-config:/mcp-config:ro
    ports:
      - "${KB_APP_PORT:-8000}:8000"

  # Opt-in ARQ worker — requires KB_REDIS_URL in `.env`:
  #   docker compose --profile queue up -d --build
  worker:
    profiles: ["queue"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.cli", "worker"]

  # stdio→HTTP MCP sidecar (opt-in): docker compose --profile mcp up -d --build
  # mcp-context7. Serves http://127.0.0.1:9300/mcp for the host-run API (or
  # http://mcp-context7:9300/mcp on the compose network); the app-side mcp.json
  # entry is the "url" form. See docs/mcp-sidecars.md.
  mcp-context7:
    profiles: ["mcp"]
    build:
      context: ./docker/mcp-sidecar
      args:
        SUPERGATEWAY_VERSION: "3.4.3"
        MCP_PACKAGE: "@upstash/context7-mcp"
        MCP_VERSION: "4.1.1"
    image: kb-mcp-context7:supergateway-3.4.3
    ports:
      - "127.0.0.1:9300:9300"
