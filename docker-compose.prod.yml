# Production application stack: pull pre-built app image from GHCR (see
# scripts/deploy.sh).
#
# Storage services (PostgreSQL + pgvector, Elasticsearch + analysis-ik, Redis)
# are NOT managed by this compose file — they are provisioned externally (e.g.
# via `knowledge-base-database` or unified orchestration in
# `knowledge-base-deploy`). Copy .env.example → .env on the server and set
# KB_DATABASE_URL, KB_ELASTICSEARCH_URL, optional KB_REDIS_URL, and other KB_*
# secrets there; never commit .env or bake it into images.
#
# `host.docker.internal` is mapped via `extra_hosts` for same-host deployments
# connecting to host-exposed storage on Linux.

services:
  app:
    image: ghcr.io/lennylin-lab/knowledge-base-server:${KB_APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Bind-mounted below. An empty (or absent, auto-created) ./mcp-config
      # dir means "no mcp.json" — MCP stays disabled, startup stays clean.
      KB_MCP_CONFIG_PATH: ${KB_MCP_CONFIG_PATH:-/mcp-config/mcp.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mcp-config:/mcp-config:ro
    ports:
      - "${KB_APP_PORT:-8000}:8000"

  # Opt-in ARQ worker — requires KB_REDIS_URL in `.env`:
  #   docker compose -f docker-compose.prod.yml --profile queue up -d
  worker:
    profiles: ["queue"]
    image: ghcr.io/lennylin-lab/knowledge-base-server:${KB_APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.cli", "worker"]

  # stdio→HTTP MCP sidecar (opt-in, built locally from this checkout — not in
  # the GHCR pipeline): docker compose -f docker-compose.prod.yml --profile mcp
  # up -d --build mcp-context7. The app reaches it on the compose network at
  # http://mcp-context7:9300/mcp (mcp.json "url" entry); no host port is
  # published. See docs/mcp-sidecars.md for the full setup.
  mcp-context7:
    profiles: ["mcp"]
    build:
      context: ./docker/mcp-sidecar
      args:
        SUPERGATEWAY_VERSION: "3.4.3"
        MCP_PACKAGE: "@upstash/context7-mcp"
        MCP_VERSION: "4.1.1"
    image: kb-mcp-context7:supergateway-3.4.3
    restart: unless-stopped
